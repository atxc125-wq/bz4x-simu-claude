name: 充電器データ更新

on:
  workflow_dispatch:  # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # コミット・プッシュに必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/fix-simulation-button-MIf4L

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージインストール
        run: pip install requests beautifulsoup4

      - name: 充電器データをビルド
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python3 build_chargers.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chargers_data.js
          if git diff --cached --quiet; then
            echo "変更なし、スキップします"
          else
            COUNT=$(node -e "const fs=require('fs');const src=fs.readFileSync('chargers_data.js','utf8');const m=src.match(/const CHARGER_DATA\s*=\s*(\[[\s\S]*?\]);/);console.log(JSON.parse(m[1]).length)")
            git commit -m "data: 充電器データ自動更新 (${COUNT}件)"
            git push origin claude/fix-simulation-button-MIf4L
          fi
