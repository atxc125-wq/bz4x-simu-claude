name: 充電器データ更新

on:
  workflow_dispatch:  # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # コミット・プッシュに必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/fix-simulation-button-MIf4L

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージインストール
        run: pip install requests beautifulsoup4

      - name: 充電器データをビルド (旧API & スクレイピング)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python3 build_chargers.py

      - name: 超高出力充電器データをビルド (新API: V2)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python3 build_chargers_v2.py

      # 🌟 ここを追加！トヨタ公式CSVからデータを抜いてV1に合体させる
      - name: トヨタ公式充電器データをビルド
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python3 build_toyota.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # V1(トヨタ合体済み) と V2 を両方ステージング
          git add chargers_data.js
          git add chargers_v2_data.js
          
          if git diff --cached --quiet; then
            echo "変更なし、スキップします"
          else
            # 既存の件数カウント (V1 + トヨタ)
            COUNT1=$(node -e "const fs=require('fs');const src=fs.readFileSync('chargers_data.js','utf8');const m=src.match(/const CHARGER_DATA\s*=\s*(\[[\s\S]*?\]);/);console.log(JSON.parse(m[1]).length)")
            
            # 新APIの件数カウント (V2)
            COUNT2=$(node -e "const fs=require('fs');if(fs.existsSync('chargers_v2_data.js')){const src=fs.readFileSync('chargers_v2_data.js','utf8');const m=src.match(/const CHARGER_V2_DATA\s*=\s*(\[[\s\S]*?\]);/);console.log(JSON.parse(m[1]).length)}else{console.log(0)}")
            
            # コミットメッセージに両方の件数を記載
            git commit -m "data: 充電器データ自動更新 (基本+トヨタ:${COUNT1}件 / V2:${COUNT2}件)"
            git push origin claude/fix-simulation-button-MIf4L
          fi
